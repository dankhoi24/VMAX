name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y swig python3-dev

      - name: Install uv
        run: python -m pip install uv

      - name: Sync backend dependencies
        run: uv sync --extra dev

      # pylibfdt 1.7.2.post1 from PyPI can build a binding that references
      # the removed PyInt_AsLong symbol. Pin upstream DTC after the official
      # compatibility fix so the CI environment is reproducible until PyPI
      # publishes a release containing that fix.
      - name: Install patched libfdt binding
        run: |
          uv pip install --python .venv/bin/python \
            "git+https://github.com/dgibson/dtc.git@5008d1d6a356b8d0a78060da2e1021507d529cff"

      - name: Verify libfdt binding
        run: .venv/bin/python -c "import libfdt; print(libfdt.__file__)"

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: .venv/bin/python -m unittest discover -s backend/tests -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
